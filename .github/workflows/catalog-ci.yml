name: Catalog CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_v2.py
      - run: python scripts/gpoctl.py search --priority P0 --limit 3
      - run: python scripts/gpoctl.py pack ransomware --priority P0 --limit 3
      - run: python scripts/gpoctl.py profile domain-controller --limit 3
      - run: python scripts/gpoctl.py path credential-theft
      - run: python scripts/export_graph.py --check
      - run: python scripts/export_graph.py --format stix --check
      - run: python scripts/baseline_compare.py --self-test
      - run: python scripts/export_neo4j.py --check
