<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Attack Path to Policy</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Attack Path to Policy</h1><a href="index.html">Explorer</a></header><main><select id="s"></select><div id="v"></div></main><script>fetch("attack-paths.json").then(r=>r.json()).then(d=>{let s=document.querySelector("#s"),v=document.querySelector("#v");Object.entries(d.paths).forEach(([id,p])=>s.add(new Option(p.title,id)));function r(){let p=d.paths[s.value];v.innerHTML="<h2>"+p.title+"</h2><div class=flow>"+p.nodes.map(n=>"<div class=node><small>"+n.type+"</small><h3>"+n.id+"</h3><p>"+n.label+"</p></div>").join("→")+"</div>"}s.onchange=r;r()})</script></body></html>
